<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strong Nation App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,800;1,900&display=swap');
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0B0B0F;
    }
    .flyer-container {
      background: linear-gradient(135deg, #0B0B0F 0%, #170A12 100%);
      position: relative;
      color: white;
    }
    .glass-card {
      background: rgba(23, 10, 18, 0.7);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(242, 15, 114, 0.3);
      box-shadow: 0 0 40px rgba(142, 45, 226, 0.2);
    }
    .text-glow {
      text-shadow: 0 0 20px rgba(242, 15, 114, 0.6);
    }
    .bg-accent {
      background: linear-gradient(135deg, #F20F72 0%, #8E2DE2 100%);
    }
  </style>
</head>
<body class="flyer-container min-h-screen flex flex-col items-center justify-center p-6 overflow-x-hidden">
  
  <!-- Background decorations -->
  <div class="fixed top-[-10%] left-[-20%] w-[150vw] h-[150vw] md:w-[600px] md:h-[600px] bg-[#F20F72]/15 rounded-full blur-[100px] pointer-events-none z-0"></div>
  <div class="fixed bottom-[-10%] right-[-20%] w-[150vw] h-[150vw] md:w-[600px] md:h-[600px] bg-[#8E2DE2]/20 rounded-full blur-[100px] pointer-events-none z-0"></div>
  
  <div class="w-full max-w-md relative z-10 flex flex-col items-center py-8">
    <!-- Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <h1 class="text-5xl md:text-6xl font-black italic tracking-tighter uppercase leading-none text-white text-glow">
        STRONG<br>
        <span class="text-[#F20F72]">NATION</span>
      </h1>
      <p class="text-sm md:text-base font-bold text-[#C93CFF] tracking-[0.2em] mt-3 uppercase">
        Más fuertes juntos 💪
      </p>
    </div>

    <!-- Main Content -->
    <div class="glass-card w-full p-8 md:p-10 rounded-[32px] flex flex-col items-center text-center">
      <h2 class="text-2xl md:text-3xl font-black mb-6 leading-tight uppercase">
        ¡Nuestra nueva App<br>ya está lista!
      </h2>
      
      <div class="bg-white p-4 rounded-3xl mb-8 shadow-2xl w-48 h-48 md:w-56 md:h-56">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://strong-iztacalco.vercel.app&color=000000&bgcolor=ffffff" alt="QR Code" class="w-full h-full object-contain">
      </div>

      <div class="w-full mb-2">
        <p class="text-sm font-bold text-white/80 mb-4 uppercase tracking-wider">
          Escanea el QR o entra a:
        </p>
        <a href="https://strong-iztacalco.vercel.app" class="bg-white/10 border border-white/20 rounded-full py-3 px-6 md:px-8 inline-block active:scale-95 transition-transform">
          <p class="text-lg md:text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#F20F72] to-[#C93CFF] tracking-wide break-all">
            strong-iztacalco.vercel.app
          </p>
        </a>
      </div>
    </div>

    <!-- Features -->
    <div class="w-full flex justify-between px-4 mt-8">
      <div class="flex flex-col items-center gap-2">
        <div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-accent flex items-center justify-center shadow-[0_0_20px_rgba(242,15,114,0.4)]">
          <span class="material-symbols-outlined text-[24px] md:text-[28px]">event_available</span>
        </div>
        <span class="text-[10px] md:text-xs font-bold tracking-wide uppercase text-center">Reserva<br>fácil</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-accent flex items-center justify-center shadow-[0_0_20px_rgba(242,15,114,0.4)]">
          <span class="material-symbols-outlined text-[24px] md:text-[28px]">notifications_active</span>
        </div>
        <span class="text-[10px] md:text-xs font-bold tracking-wide uppercase text-center">Alertas<br>de clase</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-accent flex items-center justify-center shadow-[0_0_20px_rgba(242,15,114,0.4)]">
          <span class="material-symbols-outlined text-[24px] md:text-[28px]">groups</span>
        </div>
        <span class="text-[10px] md:text-xs font-bold tracking-wide uppercase text-center">Nuestra<br>Comunidad</span>
      </div>
    </div>
  </div>
  
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" rel="stylesheet" />
</body>
</html>
