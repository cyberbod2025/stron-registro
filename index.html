<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Strong Nation Iztacalco — Regístrate para tus clases y seamos más fuertes juntas." />
    <title>Strong Nation Iztacalco</title>
    <!-- Montserrat & Inter Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,800;1,900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "YOUR_ONESIGNAL_APP_ID", // Replace with your actual OneSignal App ID
          safari_web_id: "web.onesignal.auto.xxx", // Replace if needed for Safari
          notifyButton: {
            enable: true,
            size: 'small',
            theme: 'default',
            position: 'bottom-right',
            text: {
              'tip.state.unsubscribed': 'Recibir avisos de clases',
              'tip.state.subscribed': 'Estás suscrita a los avisos',
              'tip.state.blocked': 'Avisos bloqueados',
              'message.prenotify': 'Haz clic para recibir avisos cuando se abran nuevas clases',
              'message.action.subscribed': '¡Gracias por suscribirte!',
              'message.action.resubscribed': 'Estás suscrita nuevamente',
              'message.action.unsubscribed': 'Ya no recibirás avisos',
              'dialog.main.title': 'Administrar Avisos',
              'dialog.main.button.subscribe': 'SUSCRIBIRSE',
              'dialog.main.button.unsubscribe': 'CANCELAR SUSCRIPCIÓN',
              'dialog.blocked.title': 'Desbloquear Avisos',
              'dialog.blocked.message': 'Sigue las instrucciones para permitir avisos.'
            }
          },
        });
      });
    </script>
  </head>
  <body class="bg-[#1e0f14] text-[#f9dbe2] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
